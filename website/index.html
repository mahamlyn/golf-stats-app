<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golf Stats</title>
<style>
  :root {
    --bg: #f3f5f7; --surface: #fff; --text: #172026; --muted: #6b7782; --border: #e4e8ec;
    --brand: #16a34a; --brand-dark: #15803d; --side: #0f1c17; --side-text: #a8b7af;
    --good: #15803d; --bad: #dc2626; --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; margin: 0; background: var(--bg);
         color: var(--text); display: flex; min-height: 100vh; }

  aside { width: 230px; flex-shrink: 0; background: var(--side); color: #fff; padding: 1.5rem 1rem;
          display: flex; flex-direction: column; gap: 1.5rem; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: .65rem; font-size: 1.15rem; font-weight: 700; padding: 0 .5rem; }
  .brand i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
             background: linear-gradient(135deg, #22c55e, #15803d); font-style: normal; }
  nav { display: flex; flex-direction: column; gap: .25rem; }
  nav button { border: 0; background: transparent; color: var(--side-text); text-align: left; font: inherit;
               padding: .7rem .85rem; border-radius: 10px; cursor: pointer; transition: background .15s, color .15s; }
  nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
  nav button.active { background: var(--brand); color: #fff; font-weight: 600; }
  nav .spacer { flex: 1; }

  main { flex: 1; padding: 2rem 2.5rem; max-width: 1100px; min-width: 0; }
  h2 { margin: 0 0 .25rem; font-size: 1.6rem; letter-spacing: -.02em; }
  h3 { margin: 1.5rem 0 .5rem; font-size: 1.05rem; }
  p { color: var(--muted); margin: 0 0 1rem; }

  table { border-collapse: separate; border-spacing: 0; width: 100%; background: var(--surface);
          margin: .5rem 0 1.5rem; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  th, td { padding: .75rem 1rem; text-align: left; }
  th { background: #f8fafb; color: var(--muted); font-size: .75rem; text-transform: uppercase;
       letter-spacing: .05em; font-weight: 600; border-bottom: 1px solid var(--border); }
  td { border-bottom: 1px solid var(--border); }
  tbody tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; transition: background .12s; }
  tr.click:hover { background: #f0faf3; }

  .under { color: var(--good); font-weight: 600; }
  .over { color: var(--bad); font-weight: 600; }
  .err, .ok { padding: .85rem 1rem; border-radius: 10px; font-size: .9rem; }
  .err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
  .ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

  select, input[type=text], input[type=password] { font: inherit; padding: .6rem .75rem; border: 1px solid var(--border);
          border-radius: 10px; background: var(--surface); color: var(--text); min-width: 220px; }
  select:focus, input:focus { outline: 2px solid rgba(22,163,74,.35); border-color: var(--brand); }
  main > select { margin: .75rem 0 .5rem; box-shadow: var(--shadow); }

  form { background: var(--surface); padding: 1.5rem; max-width: 480px; display: grid; gap: 1rem;
         border-radius: var(--radius); box-shadow: var(--shadow); }
  form label { display: grid; gap: .35rem; font-size: .85rem; font-weight: 600; }
  form select, form input[type=text], form input[type=password] { width: 100%; }
  form .row { display: flex; gap: .6rem; align-items: center; font-weight: 500; }
  button[type=submit], button[type=button] { font: inherit; padding: .6rem 1.1rem; border-radius: 10px; cursor: pointer;
          border: 1px solid var(--border); background: var(--surface); }
  button[type=submit] { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  button[type=submit]:hover { background: var(--brand-dark); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1rem; margin: .75rem 0 1rem; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.1rem 1.25rem; }
  .card .value { font-size: 1.8rem; font-weight: 700; letter-spacing: -.02em; }
  .card .label { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: .25rem; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 1.5rem; }
  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; margin-top: 1rem; }
  .course-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
                 cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .course-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(16,24,40,.12); }
  .course-card .body { padding: 1rem 1.1rem 1.2rem; }
  .course-card h3 { margin: 0 0 .25rem; }
  .course-card p { margin: 0; font-size: .9rem; }
  .photo { width: 100%; height: 160px; object-fit: cover; display: block; background: linear-gradient(135deg, #bbf7d0, #4ade80); }
  .photo.empty { display: grid; place-items: center; font-size: 2.5rem; }
  .hero { width: 100%; max-height: 320px; object-fit: cover; border-radius: var(--radius); box-shadow: var(--shadow); margin: 1rem 0; }
  .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem 1.5rem; margin: 1rem 0; }
  .panel h3 { margin-top: 0; }
  .panel .notes { white-space: pre-wrap; margin: 0; color: var(--text); }
  .back { border: 0; background: none; color: var(--brand-dark); cursor: pointer; font: inherit; padding: 0; margin-bottom: 1rem; }
  textarea { font: inherit; padding: .6rem .75rem; border: 1px solid var(--border); border-radius: 10px; width: 100%; min-height: 90px; resize: vertical; }
  textarea:focus { outline: 2px solid rgba(22,163,74,.35); border-color: var(--brand); }

  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  button.primary { font: inherit; padding: .6rem 1.1rem; border-radius: 10px; cursor: pointer; border: 0;
                   background: var(--brand); color: #fff; font-weight: 600; white-space: nowrap; }
  button.primary:hover { background: var(--brand-dark); }
  form.wide { max-width: none; }
  form[hidden] { display: none; }
  table.compact { box-shadow: none; border: 1px solid var(--border); margin: .5rem 0 0; }
  table.compact th, table.compact td { padding: .4rem .7rem; }
  table.compact input[type=number] { width: 90px; min-width: 0; padding: .4rem .5rem; }
  table.compact select { min-width: 0; padding: .4rem .5rem; }

  @media (max-width: 720px) {
    body { flex-direction: column; }
    aside { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; padding: .75rem 1rem; }
    nav { flex-direction: row; flex-wrap: wrap; }
    main { padding: 1.25rem; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><i>&#9971;</i>Golf Stats</div>
  <nav id="nav">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="rounds">Rounds</button>
    <button data-tab="players">Players</button>
    <button data-tab="courses">Courses</button>
    <span class="spacer"></span>
    <button data-tab="settings">Settings</button>
  </nav>
</aside>
<main id="main"></main>

<script>
const main = document.getElementById('main');

async function api(path) {
  const res = await fetch('/api/' + path);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Request failed: ' + res.status);
  return res.json();
}

async function sendJson(path, method, body) {
  const res = await fetch('/api/' + path, {
    method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return { ok: res.ok, data: await res.json() };
}

function report(box, ok, msg) {
  box.replaceChildren(el('div', { className: ok ? 'ok' : 'err', textContent: msg }));
}

// Returns the response data, or null after showing the error in `box`.
async function send(box, path, method, body) {
  try {
    const r = await sendJson(path, method, body);
    if (!r.ok) { report(box, false, r.data.error || 'Request failed.'); return null; }
    return r.data;
  } catch (e) { report(box, false, e.message); return null; }
}

function pageHeader(title, subtitle, actionLabel, onAction) {
  const btn = el('button', { type: 'button', className: 'primary', textContent: actionLabel });
  btn.onclick = onAction;
  return el('div', { className: 'page-header' },
    el('div', null, el('h2', { textContent: title }), el('p', { textContent: subtitle })), btn);
}

function el(tag, props, ...children) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  for (const c of children) e.append(c);
  return e;
}

function toPar(v) {
  const t = v > 0 ? '+' + v : String(v);
  return el('span', { className: v < 0 ? 'under' : v > 0 ? 'over' : '', textContent: v === 0 ? 'E' : t });
}

function table(columns, rows, onClick) {
  const thead = el('thead', null, el('tr', null, ...columns.map(c => el('th', { textContent: c.label }))));
  const tbody = el('tbody');
  for (const r of rows) {
    const tr = el('tr');
    for (const c of columns) {
      const td = el('td');
      const v = r[c.key];
      if (c.fmt) td.append(c.fmt(v)); else td.textContent = v;
      tr.append(td);
    }
    if (onClick) { tr.className = 'click'; tr.onclick = () => onClick(r); }
    tbody.append(tr);
  }
  return el('table', null, thead, tbody);
}

async function showRounds() {
  const rows = await api('rounds');
  main.replaceChildren(
    pageHeader('Rounds', 'Select a row to view the scorecard.', 'New round', showAddRound),
    table([
      { key: 'PlayedOn', label: 'Date' }, { key: 'CourseName', label: 'Course' },
      { key: 'PlayerName', label: 'Player' }, { key: 'HolesScored', label: 'Holes' },
      { key: 'TotalPar', label: 'Par' }, { key: 'TotalStrokes', label: 'Strokes' },
      { key: 'TotalToPar', label: 'To par', fmt: toPar },
    ], rows, r => showScorecard(r.RoundId)),
    el('div', { id: 'detail' }));
}

async function showScorecard(roundId) {
  const rows = await api(`rounds/${roundId}/scorecard`);
  const detail = document.getElementById('detail');
  detail.replaceChildren(el('h2', { textContent: 'Scorecard' }));
  const byPlayer = {};
  for (const r of rows) (byPlayer[r.PlayerName] ||= []).push(r);
  for (const [name, holes] of Object.entries(byPlayer)) {
    detail.append(el('h3', { textContent: name }), table([
      { key: 'HoleNumber', label: 'Hole' }, { key: 'Metres', label: 'Metres' },
      { key: 'Par', label: 'Par' }, { key: 'StrokeIndex', label: 'Index' },
      { key: 'Strokes', label: 'Strokes' }, { key: 'ToPar', label: 'To par', fmt: toPar },
    ], holes));
  }
  detail.scrollIntoView({ behavior: 'smooth' });
}

async function showPlayers(selectId) {
  const players = await api('players');
  const select = el('select');
  select.append(el('option', { value: '', textContent: 'Select a player...' }));
  for (const p of players) select.append(el('option', { value: p.PlayerId, textContent: p.PlayerName }));
  const detail = el('div');
  select.onchange = async () => {
    if (!select.value) return detail.replaceChildren();
    try {
      const [stats, history] = await Promise.all([
        api(`players/${select.value}/stats`), api(`players/${select.value}/history`)]);
      const rounds = history.length;
      const avgToPar = rounds ? history.reduce((s, r) => s + r.TotalToPar, 0) / rounds : 0;
      const best = rounds ? Math.min(...history.map(r => r.TotalToPar)) : 0;
      const cards = el('div', { className: 'cards' });
      const card = (label, value) => cards.append(el('div', { className: 'card' },
        el('div', { className: 'value' }, value), el('div', { className: 'label', textContent: label })));
      card('Rounds played', String(rounds));
      card('Holes played', String(history.reduce((s, r) => s + r.HolesScored, 0)));
      card('Best round (to par)', toPar(best));
      card('Average (to par)', toPar(Math.round(avgToPar * 10) / 10));
      card('Last played', rounds ? history[0].PlayedOn : '-');
      detail.replaceChildren(
        el('h3', { textContent: `${select.selectedOptions[0].textContent} - overview` }), cards,
        el('h3', { textContent: 'Course stats' }),
        table([
          { key: 'CourseName', label: 'Course' }, { key: 'RoundsPlayed', label: 'Complete rounds' },
          { key: 'BestStrokes', label: 'Best' }, { key: 'AverageStrokes', label: 'Average' },
          { key: 'LastPlayed', label: 'Last played' },
        ], stats),
        el('h3', { textContent: 'History' }),
        table([
          { key: 'PlayedOn', label: 'Date' }, { key: 'CourseName', label: 'Course' },
          { key: 'HolesScored', label: 'Holes' }, { key: 'TotalPar', label: 'Par' },
          { key: 'TotalStrokes', label: 'Strokes' }, { key: 'TotalToPar', label: 'To par', fmt: toPar },
        ], history));
    } catch (e) {
      detail.replaceChildren(el('div', { className: 'err', textContent: e.message }));
    }
  };
  const nameInput = el('input', { type: 'text', maxLength: 100, required: true });
  const addStatus = el('div');
  const addForm = el('form', { hidden: true });
  addForm.append(el('label', { textContent: 'Player name' }, nameInput),
    el('div', { className: 'row' }, el('button', { type: 'submit', textContent: 'Add player' })), addStatus);
  addForm.onsubmit = async e => {
    e.preventDefault();
    const data = await send(addStatus, 'players', 'POST', { name: nameInput.value });
    if (data) showPlayers(data.PlayerId);
  };
  const header = pageHeader('Players', 'View a player\u2019s stats and history.', 'Add player', () => {
    addForm.hidden = !addForm.hidden;
    if (!addForm.hidden) nameInput.focus();
  });
  main.replaceChildren(header, addForm, select, detail);
  if (players.length) { select.value = selectId || players[0].PlayerId; select.onchange(); }
}

async function showCourses() {
  const courses = await api('courses');
  const grid = el('div', { className: 'course-grid' });
  for (const c of courses) {
    const thumb = c.HasPhoto
      ? el('img', { className: 'photo', src: `/api/courses/${c.CourseId}/photo`, alt: '' })
      : el('div', { className: 'photo empty', textContent: '\u26F3' });
    const card = el('div', { className: 'course-card' }, thumb, el('div', { className: 'body' },
      el('h3', { textContent: c.CourseName }),
      el('p', { textContent: `${c.NumHoles} holes` }),
      el('p', { textContent: c.Description || 'No description yet.' })));
    card.onclick = () => showCourse(c.CourseId);
    grid.append(card);
  }
  main.replaceChildren(
    pageHeader('Courses', 'Select a course to see its holes, notes and photo.', 'Add course', showAddCourse), grid);
}

async function showCourse(id) {
  const [c, holes] = await Promise.all([api(`courses/${id}`), api(`courses/${id}/holes`)]);
  const back = el('button', { className: 'back', textContent: '\u2190 All courses' });
  back.onclick = () => show('courses');

  const photoView = el('div');
  const renderPhoto = has => photoView.replaceChildren(has
    ? el('img', { className: 'hero', src: `/api/courses/${id}/photo?t=${Date.now()}`, alt: c.CourseName })
    : el('p', { textContent: 'No photo uploaded.' }));
  renderPhoto(c.HasPhoto);

  const description = el('textarea', { rows: 2, maxLength: 500, value: c.Description || '' });
  const notes = el('textarea', { rows: 5, value: c.Notes || '' });
  const file = el('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp' });
  const status = el('div');
  const report = (ok, msg) => status.replaceChildren(el('div', { className: ok ? 'ok' : 'err', textContent: msg }));

  const form = el('form');
  form.append(
    el('label', { textContent: 'Description' }, description),
    el('label', { textContent: 'Notes' }, notes),
    el('label', { textContent: 'Photo (JPEG, PNG or WebP, max 2 MB)' }, file));
  const save = el('button', { type: 'submit', textContent: 'Save changes' });
  const remove = el('button', { type: 'button', textContent: 'Remove photo' });
  form.append(el('div', { className: 'row' }, save, remove), status);

  form.onsubmit = async e => {
    e.preventDefault();
    try {
      const res = await sendJson(`courses/${id}`, 'PUT', { description: description.value, notes: notes.value });
      if (!res.ok) return report(false, res.data.error);
      const f = file.files[0];
      if (f) {
        const up = await fetch(`/api/courses/${id}/photo`, { method: 'PUT', headers: { 'Content-Type': f.type }, body: f });
        if (!up.ok) return report(false, (await up.json()).error);
        renderPhoto(true); file.value = '';
      }
      report(true, 'Saved.');
    } catch (err) { report(false, err.message); }
  };
  remove.onclick = async () => {
    await fetch(`/api/courses/${id}/photo`, { method: 'DELETE' });
    renderPhoto(false); report(true, 'Photo removed.');
  };

  const text = (t, empty) => el('p', { className: 'notes', textContent: t || empty });
  main.replaceChildren(back, el('h2', { textContent: c.CourseName }),
    el('p', { textContent: `${c.NumHoles} holes` }), photoView,
    el('div', { className: 'panel' }, el('h3', { textContent: 'Description' }), text(c.Description, 'No description yet.')),
    el('div', { className: 'panel' }, el('h3', { textContent: 'Notes' }), text(c.Notes, 'No notes yet.')),
    el('h3', { textContent: 'Holes' }),
    table([
      { key: 'HoleNumber', label: 'Hole' }, { key: 'Metres', label: 'Metres' },
      { key: 'Par', label: 'Par' }, { key: 'StrokeIndex', label: 'Index' },
    ], holes),
    el('h3', { textContent: 'Edit course details' }), form);
}

async function showOverview() {
  const o = await api('overview');
  const cards = el('div', { className: 'cards' });
  for (const [label, key] of [['Courses', 'Courses'], ['Players', 'Players'], ['Rounds', 'Rounds'], ['Holes scored', 'HolesScored']]) {
    cards.append(el('div', { className: 'card' },
      el('div', { className: 'value', textContent: String(o.totals[key]) }),
      el('div', { className: 'label', textContent: label })));
  }
  main.replaceChildren(
    el('h2', { textContent: 'Overview' }),
    el('p', { textContent: 'A summary of everything in the database.' }), cards,
    el('div', { className: 'grid2' },
      el('div', null, el('h3', { textContent: 'Leaderboard' }),
        table([
          { key: 'PlayerName', label: 'Player' }, { key: 'Rounds', label: 'Rounds' },
          { key: 'AvgToParPerHole', label: 'Avg to par / hole', fmt: toPar },
        ], o.leaderboard)),
      el('div', null, el('h3', { textContent: 'Most played courses' }),
        table([
          { key: 'CourseName', label: 'Course' }, { key: 'Rounds', label: 'Rounds' },
          { key: 'LastPlayed', label: 'Last played' },
        ], o.popular))),
    el('h3', { textContent: 'Recent rounds' }),
    table([
      { key: 'PlayedOn', label: 'Date' }, { key: 'CourseName', label: 'Course' },
      { key: 'PlayerName', label: 'Player' }, { key: 'TotalStrokes', label: 'Strokes' },
      { key: 'TotalToPar', label: 'To par', fmt: toPar },
    ], o.recent));
}

async function showSettings() {
  const cfg = await api('config');
  const input = (name, type = 'text') => el('input', { name, type });
  const label = (text, ctrl) => el('label', { textContent: text }, ctrl);
  const form = el('form');
  const driver = el('select', { name: 'driver' });
  const drivers = cfg.available_drivers.includes(cfg.driver) ? cfg.available_drivers : [cfg.driver, ...cfg.available_drivers];
  for (const d of drivers) driver.append(el('option', { value: d, textContent: d }));
  const auth = el('select', { name: 'auth' });
  auth.append(el('option', { value: 'windows', textContent: 'Windows authentication' }),
              el('option', { value: 'sql', textContent: 'SQL Server authentication' }));
  const trust = el('input', { name: 'trust_server_certificate', type: 'checkbox' });
  const username = input('username'), password = input('password', 'password');
  const sqlFields = el('div', { style: 'display:grid;gap:.75rem' },
    label('Username', username), label('Password', password));
  const status = el('div');
  const server = input('server'), database = input('database');

  server.value = cfg.server; database.value = cfg.database; driver.value = cfg.driver;
  auth.value = cfg.auth; username.value = cfg.username; trust.checked = cfg.trust_server_certificate;
  password.placeholder = cfg.has_password ? '(unchanged)' : '';
  const syncAuth = () => { sqlFields.style.display = auth.value === 'sql' ? 'grid' : 'none'; };
  auth.onchange = syncAuth; syncAuth();

  const values = () => ({
    server: server.value, database: database.value, driver: driver.value, auth: auth.value,
    username: username.value, password: password.value, trust_server_certificate: trust.checked });
  const report = (ok, msg) => status.replaceChildren(el('div', { className: ok ? 'ok' : 'err', textContent: msg }));

  const test = el('button', { type: 'button', textContent: 'Test connection' });
  test.onclick = async () => {
    const { data } = await sendJson('config/test', 'POST', values());
    report(data.ok, data.ok ? 'Connection successful.' : data.error);
  };
  const save = el('button', { type: 'submit', textContent: 'Save' });
  form.onsubmit = async e => {
    e.preventDefault();
    const { ok, data } = await sendJson('config', 'PUT', values());
    report(ok, ok ? 'Settings saved.' : data.error);
  };

  form.append(label('Server', server), label('Database', database), label('ODBC driver', driver),
    label('Authentication', auth), sqlFields,
    el('label', { className: 'row' }, trust, 'Trust server certificate'),
    el('div', { className: 'row' }, save, test), status);
  main.replaceChildren(el('h2', { textContent: 'Database connection' }), el('p'), form);
}

function showAddCourse() {
  const name = el('input', { type: 'text', maxLength: 100, required: true });
  const numHoles = el('select');
  numHoles.append(el('option', { value: '9', textContent: '9 holes' }), el('option', { value: '18', textContent: '18 holes' }));
  const description = el('textarea', { rows: 2, maxLength: 500 });
  const notes = el('textarea', { rows: 4 });
  const file = el('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp' });
  const holesBox = el('div');
  const status = el('div');
  let rows = [];

  const buildHoles = () => {
    const old = rows;
    rows = [];
    const tbody = el('tbody');
    for (let i = 1; i <= Number(numHoles.value); i++) {
      const prev = old[i - 1];
      const metres = el('input', { type: 'number', min: 1, max: 2000, required: true, value: prev ? prev.metres.value : '' });
      const par = el('select');
      for (const p of [3, 4, 5, 6]) par.append(el('option', { value: String(p), textContent: String(p) }));
      par.value = prev ? prev.par.value : '4';
      const idx = el('input', { type: 'number', min: 1, max: 18, required: true, value: prev ? prev.idx.value : String(i) });
      rows.push({ metres, par, idx });
      tbody.append(el('tr', null, el('td', { textContent: String(i) }),
        el('td', null, metres), el('td', null, par), el('td', null, idx)));
    }
    const head = el('tr', null, ...['Hole', 'Metres', 'Par', 'Stroke index'].map(t => el('th', { textContent: t })));
    holesBox.replaceChildren(el('table', { className: 'compact' }, el('thead', null, head), tbody));
  };
  numHoles.onchange = buildHoles;
  buildHoles();

  const back = el('button', { className: 'back', type: 'button', textContent: '\u2190 All courses' });
  back.onclick = () => show('courses');
  const form = el('form', { className: 'wide' });
  form.append(
    el('label', { textContent: 'Course name' }, name),
    el('label', { textContent: 'Number of holes' }, numHoles),
    el('label', { textContent: 'Description' }, description),
    el('label', { textContent: 'Notes' }, notes),
    el('label', { textContent: 'Photo (optional, JPEG, PNG or WebP, max 2 MB)' }, file),
    el('div', null, el('strong', { textContent: 'Holes' }), holesBox),
    el('div', { className: 'row' }, el('button', { type: 'submit', textContent: 'Create course' })), status);

  form.onsubmit = async e => {
    e.preventDefault();
    const data = await send(status, 'courses', 'POST', {
      name: name.value, numHoles: Number(numHoles.value),
      description: description.value, notes: notes.value,
      holes: rows.map((r, i) => ({
        hole: i + 1, metres: Number(r.metres.value), par: Number(r.par.value), strokeIndex: Number(r.idx.value) })),
    });
    if (!data) return;
    const f = file.files[0];
    if (f) {
      const up = await fetch(`/api/courses/${data.CourseId}/photo`, { method: 'PUT', headers: { 'Content-Type': f.type }, body: f });
      if (!up.ok) alert('Course created, but the photo was not saved: ' + ((await up.json().catch(() => ({}))).error || up.status));
    }
    showCourse(data.CourseId);
  };
  main.replaceChildren(back, el('h2', { textContent: 'Add course' }), form);
}

async function showAddRound() {
  const [courses, players] = await Promise.all([api('courses'), api('players')]);
  const back = el('button', { className: 'back', type: 'button', textContent: '\u2190 All rounds' });
  back.onclick = () => show('rounds');
  if (!courses.length || !players.length) {
    main.replaceChildren(back, el('h2', { textContent: 'New round' }),
      el('p', { textContent: 'Add at least one course and one player first.' }));
    return;
  }

  const course = el('select');
  for (const c of courses) course.append(el('option', { value: c.CourseId, textContent: `${c.CourseName} (${c.NumHoles} holes)` }));
  const date = el('input', { type: 'date', required: true, value: new Date().toLocaleDateString('en-CA') });
  const status = el('div');
  const gridBox = el('div');
  const scoreVals = new Map();
  let holes = [];

  const picks = players.map(p => ({
    p, cb: el('input', { type: 'checkbox' }), marker: el('select', { disabled: true }) }));
  const checked = () => picks.filter(x => x.cb.checked);

  function refreshMarkers() {
    const sel = checked();
    for (const x of picks) {
      const current = x.marker.value;
      x.marker.replaceChildren(el('option', { value: '', textContent: 'No marker' }));
      for (const o of sel) if (o !== x) x.marker.append(el('option', { value: String(o.p.PlayerId), textContent: o.p.PlayerName }));
      x.marker.value = [...x.marker.options].some(o => o.value === current) ? current : '';
      x.marker.disabled = !x.cb.checked;
    }
  }

  function renderGrid() {
    const sel = checked();
    if (!holes.length || !sel.length) {
      gridBox.replaceChildren(el('p', { textContent: 'Choose at least one player to enter scores.' }));
      return;
    }
    const head = el('tr', null, el('th', { textContent: 'Hole' }), el('th', { textContent: 'Par' }),
      ...sel.map(x => el('th', { textContent: x.p.PlayerName })));
    const body = el('tbody');
    for (const h of holes) {
      const tr = el('tr', null, el('td', { textContent: String(h.HoleNumber) }), el('td', { textContent: String(h.Par) }));
      for (const x of sel) {
        const key = `${x.p.PlayerId}:${h.HoleNumber}`;
        const input = el('input', { type: 'number', min: 1, max: 20, required: true, value: scoreVals.get(key) || '' });
        input.oninput = () => scoreVals.set(key, input.value);
        tr.append(el('td', null, input));
      }
      body.append(tr);
    }
    gridBox.replaceChildren(el('table', { className: 'compact' }, el('thead', null, head), body));
  }

  async function loadHoles() {
    try { holes = await api(`courses/${course.value}/holes`); }
    catch (e) { holes = []; report(status, false, e.message); }
    scoreVals.clear();
    renderGrid();
  }
  course.onchange = loadHoles;

  const playerRows = el('tbody');
  for (const x of picks) {
    x.cb.onchange = () => { refreshMarkers(); renderGrid(); };
    playerRows.append(el('tr', null,
      el('td', null, el('label', { className: 'row' }, x.cb, x.p.PlayerName)), el('td', null, x.marker)));
  }
  refreshMarkers();
  const playerTable = el('table', { className: 'compact' },
    el('thead', null, el('tr', null, el('th', { textContent: 'Player' }), el('th', { textContent: 'Marker' }))), playerRows);

  const form = el('form', { className: 'wide' });
  form.append(
    el('label', { textContent: 'Course' }, course),
    el('label', { textContent: 'Date played' }, date),
    el('div', null, el('strong', { textContent: 'Players' }), playerTable),
    el('div', null, el('strong', { textContent: 'Scores' }), gridBox),
    el('div', { className: 'row' }, el('button', { type: 'submit', textContent: 'Save round' })), status);

  form.onsubmit = async e => {
    e.preventDefault();
    const sel = checked();
    if (!sel.length) return report(status, false, 'Select at least one player.');
    const data = await send(status, 'rounds', 'POST', {
      courseId: Number(course.value), playedOn: date.value,
      players: sel.map(x => ({
        playerId: x.p.PlayerId,
        markerPlayerId: x.marker.value ? Number(x.marker.value) : null,
        scores: holes.map(h => Number(scoreVals.get(`${x.p.PlayerId}:${h.HoleNumber}`))),
      })),
    });
    if (!data) return;
    await showRounds();
    showScorecard(data.RoundId);
  };

  main.replaceChildren(back, el('h2', { textContent: 'New round' }), form);
  await loadHoles();
}

const tabs = { overview: showOverview, rounds: showRounds, players: showPlayers, courses: showCourses, settings: showSettings };

async function show(tab) {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  try { await tabs[tab](); }
  catch (e) { main.replaceChildren(el('div', { className: 'err', textContent: e.message })); }
}

document.getElementById('nav').onclick = e => { if (e.target.dataset.tab) show(e.target.dataset.tab); };
show('overview');
</script>
</body>
